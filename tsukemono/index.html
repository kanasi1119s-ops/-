<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>俺の漬物！最強の漬物への道</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 8 8%27%3E%3Crect width=%278%27 height=%278%27 fill=%27%231c2c4c%27/%3E%3Crect x=%272%27 y=%272%27 width=%274%27 height=%274%27 fill=%27%23e7b53c%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Old+Mincho:wght@400;600;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--GAME-->
<div id="app" class="app">
  <div id="hud" class="hud" aria-live="polite"></div>
  <div id="stageWrap" class="stage">
    <canvas id="screen" aria-label="漬物屋の店先"></canvas>
    <div id="chips" class="chips"></div>
    <div id="bubbles" class="floats" aria-live="polite"></div>
    <div id="floats" class="floats" aria-hidden="true"></div>
    <div id="title" class="title-screen" hidden></div>
  </div>
  <div class="console">
    <div id="message" class="msgbox" role="status"><span id="msgText"></span><i class="caret" aria-hidden="true">▼</i></div>
    <nav id="commands" class="commands" aria-label="コマンド"></nav>
  </div>
</div>
<div id="modal" class="modal" hidden>
  <section class="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <header class="win-h"><h2 id="winTitle"></h2><button class="x" id="winClose" aria-label="閉じる">×</button></header>
    <div id="winBody" class="win-b"></div>
    <footer id="winFoot" class="win-f" hidden></footer>
  </section>
</div>
<!--/GAME-->
<script type="module" src="src/main.js"></script>
</body>
</html>
